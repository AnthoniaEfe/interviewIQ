version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./prompts:/prompts:ro
      - ./experiments:/experiments
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  frontend:
    image: node:22-bookworm
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      # Browser-facing URL (host machine → published backend port).
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      # Server-side RSC fetch inside the compose network.
      INTERNAL_API_URL: http://backend:8000
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    depends_on:
      - backend
